name: Refresh language stats

# The chart is generated from live byte counts, so it drifts as repos grow.
# Weekly is plenty - this is a pie chart, not a monitoring dashboard.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate languages.svg
        run: python scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit only if it actually changed
        run: |
          git config user.name "Shiroko7"
          git config user.email "olavarriaf20@gmail.com"
          git add languages.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Refresh language stats"
          git push
