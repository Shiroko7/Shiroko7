<rect class="seg" x="469.40" y="0" width="6.15" height="10" fill="#f0abfc" style="transform-box:fill-box;transform-origin:left;animation-delay:360ms"/>
<rect class="seg" x="475.55" y="0" width="4.45" height="10" fill="#f5d0fe" style="transform-box:fill-box;transform-origin:left;animation-delay:450ms"/>
</g>
