<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 112" width="480" height="112" role="img" aria-label="Language split across my public repositories">
<title>Languages</title>
<style>.lbl{font:500 11px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8b5cf6}.pct{font:400 11px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#a78bfa}.quip{font:italic 400 11.5px ui-serif,Georgia,'Times New Roman',serif;fill:#a78bfa;opacity:.92}.cap{font:400 9.5px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#a78bfa;opacity:.6}.seg{animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.seg{animation:none}}</style>
<clipPath id="r"><rect x="0" y="0" width="480" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)">
<rect class="seg" x="0.00" y="0" width="305.67" height="10" fill="#8b5cf6" style="transform-box:fill-box;transform-origin:left;animation-delay:0ms"/>
<rect class="seg" x="305.67" y="0" width="101.12" height="10" fill="#a78bfa" style="transform-box:fill-box;transform-origin:left;animation-delay:90ms"/>
<rect class="seg" x="406.80" y="0" width="36.30" height="10" fill="#c084fc" style="transform-box:fill-box;transform-origin:left;animation-delay:180ms"/>
<rect class="seg" x="443.09" y="0" width="19.99" height="10" fill="#e879f9" style="transform-box:fill-box;transform-origin:left;animation-delay:270ms"/>
<rect class="seg" x="463.08" y="0" width="9.82" height="10" fill="#f0abfc" style="transform-box:fill-box;transform-origin:left;animation-delay:360ms"/>
<rect class="seg" x="472.90" y="0" width="7.10" height="10" fill="#f5d0fe" style="transform-box:fill-box;transform-origin:left;animation-delay:450ms"/>
</g>
