<rect class="seg" x="469.53" y="0" width="5.42" height="10" fill="#f5d0fe" style="transform-box:fill-box;transform-origin:left;animation-delay:450ms"/>
<rect class="seg" x="474.95" y="0" width="5.05" height="10" fill="#8b5cf6" style="transform-box:fill-box;transform-origin:left;animation-delay:540ms"/>
</g>
