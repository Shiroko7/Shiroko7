<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 112" width="480" height="112" role="img" aria-label="Language split across my public repositories">
<title>Languages</title>
<style>.lbl{font:500 11px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8b5cf6}.pct{font:400 11px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#a78bfa}.quip{font:italic 400 11.5px ui-serif,Georgia,'Times New Roman',serif;fill:#a78bfa;opacity:.92}.cap{font:400 9.5px ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#a78bfa;opacity:.6}.seg{animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.seg{animation:none}}</style>
<clipPath id="r"><rect x="0" y="0" width="480" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)">
