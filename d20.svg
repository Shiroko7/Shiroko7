<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132" role="img" aria-label="A slowly floating twenty-sided die">
  <title>d20</title>
  <style>
    .die {
      transform-box: fill-box;
      transform-origin: center;
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2.5deg); }
      50%      { transform: translateY(-5px) rotate(2.5deg); }
    }

    .shadow { animation: shade 5s ease-in-out infinite; }
    @keyframes shade {
      0%, 100% { opacity: .28; transform: scale(1); }
      50%      { opacity: .16; transform: scale(.86); }
    }

    .facet { stroke: #a78bfa; stroke-width: 1.4; stroke-linejoin: round; }
    .num   { animation: glow 5s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { opacity: .95; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .die, .shadow, .num { animation: none; }
    }
  </style>

  <!-- ground shadow, breathing with the float -->
  <ellipse class="shadow" cx="60" cy="125" rx="26" ry="4.5" fill="#8b5cf6"
           style="transform-box: fill-box; transform-origin: center;"/>

  <g class="die">
    <!-- ten visible faces of a d20 seen face-on -->
    <g class="facet">
      <polygon points="60,35  106.8,35  60,8"    fill="#a78bfa" fill-opacity=".20"/>
      <polygon points="60,8   13.2,35  60,35"    fill="#a78bfa" fill-opacity=".28"/>
      <polygon points="60,35  106.8,35 86.9,81.5" fill="#a78bfa" fill-opacity=".14"/>
      <polygon points="60,35  33.2,81.5 13.2,35" fill="#a78bfa" fill-opacity=".22"/>
      <polygon points="106.8,35 106.8,89 86.9,81.5" fill="#a78bfa" fill-opacity=".30"/>
      <polygon points="13.2,35 33.2,81.5 13.2,89" fill="#a78bfa" fill-opacity=".18"/>
      <polygon points="86.9,81.5 106.8,89 60,116" fill="#a78bfa" fill-opacity=".24"/>
      <polygon points="33.2,81.5 60,116 13.2,89" fill="#a78bfa" fill-opacity=".32"/>
      <polygon points="86.9,81.5 60,116 33.2,81.5" fill="#a78bfa" fill-opacity=".12"/>
      <!-- the face you rolled -->
      <polygon points="60,35  86.9,81.5 33.2,81.5" fill="#a78bfa" fill-opacity=".38"/>
    </g>

    <!-- silhouette, drawn last so the outline stays crisp -->
    <polygon points="60,8 106.8,35 106.8,89 60,116 13.2,89 13.2,35"
             fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linejoin="round"/>

    <text class="num" x="60" y="74.5" text-anchor="middle"
          font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="25" font-weight="700" fill="#8b5cf6">20</text>
  </g>
</svg>
